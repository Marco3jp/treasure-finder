<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Treasure Finder サンプル</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #2a241c;
      color: #f4efe6;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    figure { margin: 0; }
    video {
      width: 640px;
      height: 360px;
      background: #000;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    figcaption { margin-top: 12px; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <figure>
    <video src="/sample.mp4" autoplay muted loop playsinline></video>
    <figcaption>640×360 で置いた video。撮影結果は 1920×1080 になります。</figcaption>
  </figure>
</body>
</html>
